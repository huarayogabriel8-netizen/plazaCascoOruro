
name: Publicar Plaza Casco de Oruro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto y modelos LFS
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos de la página
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
